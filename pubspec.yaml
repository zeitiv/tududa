name: tududa
description: "Tududa - A calm, open system for organizing life and work."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.13.0
  flutter: 3.47.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # State Management
  flutter_riverpod: ^3.4.0
  
  # Networking
  dio: ^5.7.0
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8
  
  # Storage
  shared_preferences: ^2.3.4
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.5
  
  # Routing
  go_router: ^18.1.0
  
  # UI
  google_fonts: ^6.2.1
  flutter_markdown: ^0.7.6
  flutter_slidable: ^3.1.1
  
  # Utils
  intl: ^0.20.3
  json_annotation: ^4.9.0
  equatable: ^2.0.7
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  json_serializable: ^6.9.4
  build_runner: ^2.4.14
  flutter_launcher_icons: ^0.14.4
  mocktail: ^1.0.5
  shelf: ^1.4.2

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
