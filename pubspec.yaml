name: tududa
description: "Tududa - A calm, open system for organizing life and work."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.13.0
  flutter: 3.47.7

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State Management
  flutter_riverpod: ^3.4.0
  
  # Networking
  dio: ^5.7.0
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8
  
  # Storage
  shared_preferences: ^2.3.4
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.5
  
  # Routing
  go_router: ^18.1.0
  
  # UI
  flutter_markdown_plus: ^1.0.3
  dynamic_color: ^1.7.0
  flutter_slidable: ^3.1.1
  
  # Utils
  intl: ^0.20.3
  json_annotation: ^4.9.0
  equatable: ^2.0.7
  uuid: ^4.5.1
  freezed_annotation: ^3.0.0
  connectivity_plus: ^7.0.0
  timezone: ^0.10.0
  flutter_timezone: ^5.0.0
  drift: 2.34.0
  drift_flutter: ^0.3.1
  sqlite3: ^3.7.1
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  alchemist: ^0.13.0
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  json_serializable: ^6.9.4
  build_runner: ^2.4.14
  freezed: ^3.0.0
  flutter_launcher_icons: ^0.14.4
  mocktail: ^1.0.5
  fake_async: ^1.3.3
  shelf: ^1.4.2
  drift_dev: 2.34.0

flutter:
  uses-material-design: true
  generate: true

  fonts:
    # Variable font (wght axis); bundled so the theme works offline. OFL.txt
    # sits next to it. CJK text falls back to the platform font.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
