name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Analyze & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: pubspec.yaml
          channel: 'stable'
          cache: true

      - name: Verify Flutter version matches pubspec.yaml
        run: |
          expected=$(grep -E '^\s+flutter:\s*[0-9]+\.[0-9]+\.[0-9]+' pubspec.yaml | head -n1 | awk '{print $2}')
          if [ -z "$expected" ]; then
            echo "::error::No pinned Flutter version found in pubspec.yaml"
            exit 1
          fi
          actual=$(flutter --version | head -n1 | awk '{print $2}')
          echo "expected=$expected actual=$actual"
          if [ "$expected" != "$actual" ]; then
            echo "::error::Flutter $actual does not match pubspec.yaml pin $expected"
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      # Generated files (*.g.dart, *.freezed.dart, drift) are gitignored.
      - name: Run code generation
        run: dart run build_runner build -d

      - name: Check merged ARB files
        run: dart run tool/merge_arb.dart --check

      # lib/l10n/gen is committed; fail when it is stale relative to lib/l10n/arb.
      - name: Check generated localizations are fresh
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/l10n

      - name: Check formatting
        run: git ls-files -z '*.dart' | xargs -0 dart format --output=none --set-exit-if-changed

      - name: Analyze
        run: flutter analyze --fatal-infos

      # Includes the `golden` tag: CI-only, deterministic (Ahem font) alchemist goldens.
      - name: Test
        run: flutter test --concurrency=4 --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 7

  android-unit:
    name: Android unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      # The Android Gradle build includes the Flutter Gradle plugin, which needs the
      # Flutter SDK path from android/local.properties (written by `flutter pub get`).
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: pubspec.yaml
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Ensure Gradle wrapper
        run: sh tool/ci/ensure_gradlew.sh

      - name: Run Kotlin unit tests
        working-directory: android
        run: ./gradlew :tududi_core:testDebugUnitTest :app:testDebugUnitTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-unit-test-reports
          path: |
            android/tududi_core/build/reports/tests
            android/tududi_core/build/test-results
            android/app/build/reports/tests
            android/app/build/test-results
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: pubspec.yaml
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run code generation
        run: dart run build_runner build -d

      - name: Build debug APK
        run: flutter build apk --debug

      # No android/key.properties here, so Gradle signs the release build with the debug key.
      - name: Build release APK
        run: flutter build apk --release

      - name: Print APK sizes
        run: |
          for apk in build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/app-release.apk; do
            size=$(wc -c < "$apk")
            echo "$apk: $size bytes"
            echo "- \`$(basename "$apk")\`: $(( size / 1024 )) KiB" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tududa-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

      - name: Upload release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tududa-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  security:
    name: Secret & dependency scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks-action lists PR commits

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Fails the job on any finding. No license key is needed for personal-account repos;
      # an organisation owner would have to add GITLEAKS_LICENSE as a secret.
      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

      - name: Collect lockfiles for OSV
        id: osv
        run: |
          {
            echo 'args<<OSV_ARGS_EOF'
            # One argument per line (the action's contract); same shape as its default.
            for f in pubspec.lock android/gradle/libs.versions.toml; do
              if [ -f "$f" ]; then echo "--lockfile=$f"; fi
            done
            find android -name '*.lockfile' -not -path '*/build/*' | sort | while read -r f; do
              echo "--lockfile=$f"
            done
            echo 'OSV_ARGS_EOF'
          } >> "$GITHUB_OUTPUT"

      # Exits non-zero when vulnerabilities are found.
      - name: Scan dependencies (OSV)
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: ${{ steps.osv.outputs.args }}

  emulator-smoke:
    name: Emulator smoke test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: pubspec.yaml
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run code generation
        run: dart run build_runner build -d

      - name: Ensure Gradle wrapper
        run: sh tool/ci/ensure_gradlew.sh

      - name: Download debug APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tududa-debug-apk
          path: apk

      - name: Smoke test on emulator
        uses: reactivecircus/android-emulator-runner@e93c997dcab69054e999e3924af3d21c4a736e13 # v2.9.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          # Each line runs as its own shell. The cold start report only summarises (never fails).
          script: |
            sh tool/ci/emulator_smoke.sh apk/app-debug.apk
            sh tool/ci/cold_start.sh 5 || true

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: emulator-logcat
          path: logcat.txt
          if-no-files-found: ignore
          retention-days: 7
