targets:
  $default:
    builders:
      json_serializable:
        options:
          field_rename: snake
          checked: true
          explicit_to_json: true
          include_if_null: false
      drift_dev:
        options:
          # ISO-8601 text keeps millisecond precision and is readable in dumps.
          store_date_time_values_as_text: true
          databases:
            app_database: lib/core/db/app_database.dart
          schema_dir: drift_schemas/
          test_dir: test/core/db/generated/
          sql:
            dialect: sqlite
            options:
              version: "3.45"
              modules: [fts5]
