name: tududa
description: "Tududa - a spatial home for Tududi, Karakeep, Memos and Flatastic."
publish_to: 'none'
version: 2.0.0+3

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1

  # Networking
  dio: ^5.7.0
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8

  # Storage
  shared_preferences: ^2.3.4
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.5

  # UI
  flutter_markdown: ^0.7.6
  url_launcher: ^6.3.1

  # Utils
  intl: ^0.20.2
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
