name: Build & Release APK

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Whether to create a GitHub Release in manual runs'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Tag to use for manual release (for example: v1.0.1)'
        required: false
        type: string
  # Triggered automatically on tag push (e.g. v1.0.0)
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the code
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # 2. Install Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Install Flutter (version pinned in pubspec.yaml)
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: pubspec.yaml
          channel: 'stable'
          cache: true

      # 4. Decode the signing keystore from GitHub Secrets
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      # 5. Create key.properties
      - name: Create key.properties
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      # 6. Install dependencies
      - name: Install dependencies
        run: flutter pub get

      # 7. Analyze and test before building
      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # 8. Build the release APK
      - name: Build APK
        run: flutter build apk --release

      # 9. Upload the APK as a build artifact
      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tududa-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  # Automatically create a GitHub Release on tag push
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release && inputs.release_tag != '')
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

    permissions:
      contents: write

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tududa-release-apk

      - name: Rename APK
        run: mv app-release.apk tududa-${RELEASE_TAG}.apk

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Tududa ${{ env.RELEASE_TAG }}
          body: |
            ## Tududa ${{ env.RELEASE_TAG }}

            ### 📦 下载
            下载下方的 APK 文件安装到 Android 设备。

            ### ⚠️ 安装说明
            需要在手机设置中允许「安装未知来源应用」。
          files: tududa-${{ env.RELEASE_TAG }}.apk
          draft: false
          prerelease: false
